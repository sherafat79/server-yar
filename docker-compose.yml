services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/serveryar.db
      # The host port below maps to this one; keep it at 8080.
      PORT: 8080
    ports:
      # Only reachable from this machine. Host Nginx terminates TLS and proxies to it.
      - "127.0.0.1:6000:8080"
    volumes:
      - serveryar_data:/data

volumes:
  serveryar_data:
